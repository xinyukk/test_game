<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🗣️ 私密语音代聊室</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #25D366; --primary-dark: #128C7E; --secondary: #075E54;
            --gray: #e5ddd5; --light-gray: #f0f4f8; --text-dark: #333; --text-light: #888;
            --border-radius: 16px; --transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px; color: var(--text-dark);
        }
        .app-container {
            width: 100%; max-width: 480px; height: 95vh; max-height: 850px;
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25); display: flex; flex-direction: column; position: relative;
        }
        .app-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #34b7f1, #25D366, #00e676); z-index: 10;
        }
        #login-screen {
            padding: 40px 30px; text-align: center; display: flex;
            flex-direction: column; gap: 20px; background: var(--light-gray); height: 100%; justify-content: center;
        }
        h1 { font-size: 26px; color: var(--secondary); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .subtitle { color: var(--text-light); font-size: 14px; line-height: 1.5; margin-bottom: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        .input-field {
            width: 100%; padding: 16px 20px; border: 2px solid #d0d5dd;
            border-radius: var(--border-radius); font-size: 16px;
        }
        .input-field:focus { outline: none; border-color: var(--primary); }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            padding: 16px; border: none; border-radius: var(--border-radius); font-size: 17px;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
        }
        .btn-create { background: linear-gradient(120deg, #28a745, #20c997); color: white; }
        .btn-join { background: linear-gradient(120deg, #007bff, #1e90ff); color: white; }
        .status { min-height: 24px; color: #e74c3c; font-size: 14px; font-weight: 500; }
        .status.success { color: #28a745; }
        .status.info { color: #007bff; }
        #chat-screen { display: none; flex-direction: column; height: 100%; position: relative; }
        .chat-header {
            background: var(--secondary); color: white; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .header-title { display: flex; flex-direction: column; align-items: flex-start; }
        .title { font-size: 16px; font-weight: 600; }
        .room-id { font-size: 12px; opacity: 0.9; margin-top: 4px; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 10px; cursor: pointer; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            background: rgba(255,255,255,0.15); border: none; width: 36px; height: 36px;
            border-radius: 50%; color: white; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn.active { background: rgba(37, 211, 102, 0.8); }
        .btn-test { background: rgba(243, 156, 18, 0.9); }
        .exit-btn { background: rgba(231, 76, 60, 0.8); }
        .chat-box {
            flex: 1; padding: 20px 15px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 16px; background-color: var(--gray); padding-bottom: 80px;
        }
        .message {
            max-width: 85%; padding: 12px 16px; border-radius: var(--border-radius);
            font-size: 15px; line-height: 1.45; position: relative;
            animation: fadeIn 0.3s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.05); word-wrap: break-word;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg-friend { align-self: flex-start; background: white; border-bottom-left-radius: 4px; border: 1px solid #e1e6eb; }
        .msg-system { align-self: center; background: rgba(0,0,0,0.08); color: var(--text-light); font-size: 13px; border-radius: 20px; padding: 6px 14px; text-align: center; }
        .msg-name { font-size: 12px; opacity: 0.8; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 15px; }
        .input-area {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 15px;
            background: white; border-top: 1px solid #e1e6eb; display: flex; gap: 10px; z-index: 20;
        }
        #msg-input {
            flex: 1; padding: 12px 18px; border: 2px solid #d0d5dd; border-radius: 25px;
            font-size: 15px; outline: none;
        }
        #send-btn {
            background: var(--primary); color: white; border: none; border-radius: 50%;
            width: 46px; height: 46px; font-size: 18px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; flex-shrink: 0;
        }
        .empty-state { text-align: center; color: var(--text-light); padding: 40px 20px; line-height: 1.6; }
        @media (max-width: 480px) { .app-container { height: 100vh; border-radius: 0; } }
    </style>
</head>
<body>
    <audio id="cloud-tts-audio" style="display: none;"></audio>

    <div class="app-container">
        <div id="login-screen">
            <h1><i class="fas fa-comment-dots"></i> 语音代聊室</h1>
            <p class="subtitle" id="welcome-text">🔐 端到端加密 · 离开即销毁</p>
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="输入你的昵称 (必填)" maxlength="10">
                <input type="text" id="password" class="input-field" placeholder="输入房间口令 (留空则自动生成)" maxlength="15">
            </div>
            <div class="btn-group">
                <button class="btn btn-create" onclick="createRoom()">
                    <i class="fas fa-door-open"></i> 创建新房间
                </button>
                <button class="btn btn-join" onclick="joinRoom()">
                    <i class="fas fa-user-friends"></i> 加入房间
                </button>
            </div>
            <div id="login-status" class="status"></div>
            <p style="color: var(--text-light); font-size: 12px; margin-top: 10px;">
                <i class="fas fa-info-circle"></i> 已开启云端语音增强，适配所有浏览器
            </p>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <div class="header-title">
                    <div class="title">🔒 私密聊天</div>
                    <div class="room-id" onclick="shareRoom()" title="点击复制">
                        口令: <span id="header-pwd"></span> <i class="fas fa-copy"></i>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn btn-test" onclick="forceTestAudio()" title="测试并发声">
                        <i class="fas fa-play"></i>
                    </button>
                    <button id="voice-toggle" class="icon-btn active" onclick="toggleVoice()" title="语音开关">
                        <i class="fas fa-volume-up"></i>
                    </button>
                    <button class="icon-btn exit-btn" onclick="exitChat()" title="退出房间">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
            <div class="chat-box" id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="输入消息 (回车发送)..." autocomplete="off">
                <button id="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const ROOM_PREFIX = 'p2p-tts-chat-v7-'; 
        let peer = null, conn = null, myName = '', roomPassword = '', isVoiceEnabled = true;
        let connectionTimeout = null, signalingTimeout = null; // 新增超时控制变量
        
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const loginStatus = document.getElementById('login-status');
        const voiceToggleBtn = document.getElementById('voice-toggle');
        const pwdInput = document.getElementById('password');
        const cloudAudio = document.getElementById('cloud-tts-audio');

        document.addEventListener('DOMContentLoaded', () => {
            const inviteRoom = new URLSearchParams(window.location.search).get('room');
            if (inviteRoom) {
                pwdInput.value = inviteRoom;
                document.getElementById('welcome-text').innerHTML = '👋 你收到了聊天邀请<br>输入昵称并加入';
            }
            msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        });

        // ==========================================
        // 终极双重发声机制（原生 TTS + 云端 MP3 兜底）
        // ==========================================
        function speakText(text) {
            if (!isVoiceEnabled || !text) return;
            
            if ('speechSynthesis' in window && window.SpeechSynthesisUtterance) {
                try {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-CN';
                    utterance.rate = 1.1;
                    
                    utterance.onerror = () => playCloudTTS(text);
                    
                    window.speechSynthesis.speak(utterance);
                    return; 
                } catch (e) {
                    console.warn("原生TTS崩溃，启用云端兜底", e);
                }
            }
            
            playCloudTTS(text);
        }

        function playCloudTTS(text) {
            try {
                const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&le=zh`;
                cloudAudio.src = url;
                cloudAudio.play().catch(e => console.log("等待用户物理交互解锁音频..."));
            } catch (err) {
                console.error("云端发声也失败:", err);
            }
        }

        function forceTestAudio() {
            cloudAudio.src = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent('语音通道已全面就绪')}&le=zh`;
            cloudAudio.play().then(() => {
                alert("✅ 语音通道已打通！原生浏览器拦截已绕过，已自动启用云端语音加速！");
            }).catch(e => {
                if ('speechSynthesis' in window) {
                    try {
                        window.speechSynthesis.cancel();
                        let u = new SpeechSynthesisUtterance('原生通道就绪');
                        u.lang = 'zh-CN';
                        window.speechSynthesis.speak(u);
                        alert("原生语音通道就绪。");
                    } catch (err) {
                        alert("您的浏览器限制了所有发声请求，请在设置中允许本网页的音频播放权限！");
                    }
                }
            });
        }

        function createRoom() {
            myName = document.getElementById('username').value.trim();
            if (!myName) return showStatus('❌ 请输入昵称', 'error');
            
            cloudAudio.play().catch(e=>{});

            roomPassword = pwdInput.value.trim() || Math.random().toString(36).substring(2, 8).toUpperCase();
            pwdInput.value = roomPassword;
            showStatus('🔬 正在建立通道...', 'info');
            initPeer(ROOM_PREFIX + roomPassword, true);
        }

        function joinRoom() {
            myName = document.getElementById('username').value.trim();
            roomPassword = pwdInput.value.trim();
            if (!myName) return showStatus('❌ 请输入昵称', 'error');
            if (!roomPassword) return showStatus('❌ 请输入口令', 'error');
            
            cloudAudio.play().catch(e=>{});

            showStatus('🔍 连接中...', 'info');
            initPeer(null, false);
        }

        // ==========================================
        // 更新后的 Peer 初始化逻辑（加入国内STUN与超时熔断）
        // ==========================================
        function initPeer(peerId, isHost) {
            cleanupPeer();
            
            // 使用国内友好的 STUN 服务器，并修复 url -> urls 语法
            const config = { 
                iceServers: [
                    {urls: 'stun:stun.qq.com:3478'},
                    {urls: 'stun:stun.miwifi.com:3478'},
                    {urls: 'stun:stun.chat.bilibili.com:3478'}
                ] 
            };
            
            peer = peerId ? new Peer(peerId, {config}) : new Peer({config});

            // 1. 信令服务器连接超时检测 (15秒)
            signalingTimeout = setTimeout(() => {
                if (peer && !peer.open) {
                    showStatus('❌ 核心服务器连接超时，请检查网络', 'error');
                    cleanupPeer();
                }
            }, 15000);

            peer.on('open', (id) => {
                clearTimeout(signalingTimeout); // 连上信令服务器，取消报错
                
                if (isHost) {
                    enterChatUI(true);
                } else {
                    const c = peer.connect(ROOM_PREFIX + roomPassword, {reliable: true});
                    setupConnectionEvents(c, 'guest');
                    
                    // 2. 房间(P2P)直连超时检测 (10秒)
                    connectionTimeout = setTimeout(() => {
                        if (conn && !conn.open) {
                            showStatus('❌ 房间连接超时(跨网穿透失败)', 'error');
                            cleanupPeer();
                            chatScreen.style.display = 'none'; 
                            loginScreen.style.display = 'flex';
                        }
                    }, 10000);
                }
            });

            if (isHost) peer.on('connection', (c) => conn ? c.close() : setupConnectionEvents(c, 'host'));

            peer.on('error', (err) => {
                clearTimeout(signalingTimeout);
                if (connectionTimeout) clearTimeout(connectionTimeout);

                if (err.type === 'unavailable-id') showStatus('❌ 口令已被使用', 'error');
                else if (err.type === 'peer-unavailable') showStatus('❌ 找不到该房间或对方已退出', 'error');
                else if (err.type === 'network') showStatus('❌ 网络受限：无法连接到通信节点', 'error');
                else showStatus(`❌ 连接断开: ${err.type}`, 'error');
                
                cleanupPeer();
                chatScreen.style.display = 'none'; 
                loginScreen.style.display = 'flex';
            });
        }

        function setupConnectionEvents(c, role) {
            conn = c;
            conn.on('open', () => {
                // 成功连上后，立刻清除超时报错定时器
                if (connectionTimeout) clearTimeout(connectionTimeout); 
                
                if (role === 'guest') enterChatUI(false);
                const emptyState = chatBox.querySelector('.empty-state');
                if (emptyState) emptyState.remove();
                appendMessage('系统', role === 'host' ? `对方已加入` : `${myName} 加入了聊天`, 'system');
                if (role === 'guest') conn.send({ type: 'system', text: `${myName} 成功连接` });
            });
            conn.on('data', (data) => {
                if (data.type === 'chat') { 
                    appendMessage(data.name, data.text, 'friend'); 
                    speakText(data.text); 
                } else if (data.type === 'system') {
                    appendMessage('系统', data.text, 'system');
                }
            });
            conn.on('close', () => { 
                appendMessage('系统', '⚠️ 对方已断开连接', 'system'); 
                conn = null; 
            });
        }

        function enterChatUI(isHost) {
            loginScreen.style.display = 'none'; chatScreen.style.display = 'flex';
            document.getElementById('header-pwd').textContent = roomPassword; chatBox.innerHTML = '';
            chatBox.innerHTML = isHost ? `<div class="empty-state"><i class="fas fa-user-clock" style="font-size:30px;"></i><p style="margin:15px 0;">等待对方加入...</p><button onclick="shareRoom()" style="padding:10px 20px; border-radius:20px; border:none; background:var(--primary); color:white;">点击复制邀请链接</button><p style="font-size: 12px; margin-top: 15px; color: var(--primary);">↑若无声音，请点右上角橙色按钮↑</p></div>` : `<div class="empty-state">连接中...</div>`;
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !conn || !conn.open) return;
            appendMessage(myName, text, 'me');
            conn.send({ type: 'chat', name: myName, text: text });
            msgInput.value = '';
        }

        function appendMessage(sender, text, type) {
            const div = document.createElement('div'); div.className = `message msg-${type}`;
            if (type === 'system') div.textContent = text;
            else {
                const now = new Date(); const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                div.innerHTML = `<div class="msg-name"><span>${sender}</span> <span>${timeStr}</span></div><div>${text}</div>`;
            }
            chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
        }

        function shareRoom() {
            const url = `${window.location.origin}${window.location.pathname}?room=${roomPassword}`;
            (navigator.clipboard && window.isSecureContext) ? navigator.clipboard.writeText(url).then(()=>alert(`✅ 链接已复制！口令：${roomPassword}`)).catch(()=>prompt("手动复制:", url)) : prompt("手动复制:", url);
        }

        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            voiceToggleBtn.className = `icon-btn ${isVoiceEnabled ? 'active' : ''}`;
            voiceToggleBtn.innerHTML = `<i class="fas fa-volume-${isVoiceEnabled ? 'up' : 'mute'}"></i>`;
            if (!isVoiceEnabled) {
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                cloudAudio.pause();
            } else {
                forceTestAudio();
            }
        }

        function exitChat() {
            if (confirm('退出房间？')) {
                cleanupPeer(); window.history.replaceState({}, document.title, window.location.pathname);
                chatScreen.style.display = 'none'; loginScreen.style.display = 'flex'; pwdInput.value = '';
            }
        }
        
        function cleanupPeer() { 
            if (signalingTimeout) clearTimeout(signalingTimeout);
            if (connectionTimeout) clearTimeout(connectionTimeout);
            if (conn) {try{conn.close();}catch(e){}} conn=null; 
            if(peer) {try{peer.destroy();}catch(e){}} peer=null; 
        }
        
        function showStatus(msg, type, duration=3000) { 
            loginStatus.textContent = msg; 
            loginStatus.className = `status ${type}`; 
            setTimeout(()=>{if(loginStatus.textContent===msg)loginStatus.textContent='';}, duration); 
        }
    </script>
</body>
</html>
