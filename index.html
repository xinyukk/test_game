<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🗣️ 私密语音代聊室</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #25D366;
            --primary-dark: #128C7E;
            --secondary: #075E54;
            --gray: #e5ddd5;
            --light-gray: #f0f4f8;
            --text-dark: #333;
            --text-light: #888;
            --border-radius: 16px;
            --transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px; color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }
        
        .app-container {
            width: 100%; max-width: 480px; height: 95vh; max-height: 850px;
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            display: flex; flex-direction: column; position: relative;
        }
        
        .app-container::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #34b7f1, #25D366, #00e676); z-index: 10;
        }
        
        /* 登录界面 */
        #login-screen {
            padding: 40px 30px; text-align: center; display: flex;
            flex-direction: column; gap: 22px; background: var(--light-gray);
            height: 100%; justify-content: center;
        }
        
        #login-screen h1 { font-size: 30px; color: var(--secondary); display: flex; align-items: center; justify-content: center; gap: 10px; }
        #login-screen p.subtitle { color: var(--text-light); font-size: 15px; line-height: 1.5; }
        
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        .input-field {
            width: 100%; padding: 16px 20px; border: 2px solid #d0d5dd;
            border-radius: var(--border-radius); font-size: 16px; transition: var(--transition);
        }
        .input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.2); }
        .input-field.readonly { background: #e9ecef; color: #6c757d; border-color: #ced4da; cursor: not-allowed; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        
        .btn {
            padding: 16px; border: none; border-radius: var(--border-radius); font-size: 17px;
            font-weight: 600; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
        }
        .btn:active { transform: translateY(2px); }
        
        .btn-create { background: linear-gradient(120deg, #28a745, #20c997); color: white; box-shadow: 0 4px 14px rgba(40, 167, 69, 0.35); }
        .btn-create:hover { background: linear-gradient(120deg, #218838, #1e9e7c); }
        
        .btn-join { background: linear-gradient(120deg, #007bff, #1e90ff); color: white; box-shadow: 0 4px 14px rgba(0, 123, 255, 0.35); }
        .btn-join:hover { background: linear-gradient(120deg, #0069d9, #187bcd); }
        
        .status { min-height: 24px; color: #e74c3c; font-size: 14px; font-weight: 500; padding: 0 10px; transition: var(--transition); }
        .status.success { color: #28a745; }
        .status.info { color: #007bff; }
        
        /* 聊天界面 */
        #chat-screen { display: none; flex-direction: column; height: 100%; position: relative; }
        
        .chat-header {
            background: var(--secondary); color: white; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .header-title { display: flex; flex-direction: column; align-items: flex-start; }
        .header-title .title { font-size: 17px; font-weight: 600; }
        .room-id { font-size: 13px; opacity: 0.9; margin-top: 4px; letter-spacing: 1px; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 10px; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            background: rgba(255,255,255,0.15); border: none; width: 38px; height: 38px;
            border-radius: 50%; color: white; font-size: 16px; cursor: pointer;
            transition: var(--transition); display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
        .icon-btn.active { background: rgba(37, 211, 102, 0.8); }
        .exit-btn { background: rgba(231, 76, 60, 0.8); }
        .exit-btn:hover { background: rgba(192, 57, 43, 1); }
        
        .chat-box {
            flex: 1; padding: 20px 15px; overflow-y: auto; display: flex;
            flex-direction: column; gap: 16px; background-color: var(--gray); padding-bottom: 80px;
        }
        
        .message {
            max-width: 85%; padding: 12px 16px; border-radius: var(--border-radius);
            font-size: 15px; line-height: 1.45; position: relative;
            animation: fadeIn 0.3s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-me { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg-friend { align-self: flex-start; background: white; border-bottom-left-radius: 4px; border: 1px solid #e1e6eb; }
        .msg-system { align-self: center; background: rgba(0,0,0,0.05); color: var(--text-light); font-size: 13px; border-radius: 20px; padding: 6px 14px; margin: 5px 0; box-shadow: none; text-align: center; }
        
        .msg-name { font-size: 12px; opacity: 0.8; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 15px; }
        
        .input-area {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 15px;
            background: white; border-top: 1px solid #e1e6eb; display: flex; gap: 10px; z-index: 20;
        }
        #msg-input {
            flex: 1; padding: 12px 18px; border: 2px solid #d0d5dd; border-radius: 25px;
            font-size: 15px; outline: none; transition: var(--transition);
        }
        #msg-input:focus { border-color: var(--primary); }
        #send-btn {
            background: var(--primary); color: white; border: none; border-radius: 50%;
            width: 46px; height: 46px; font-size: 18px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: var(--transition); flex-shrink: 0;
        }
        #send-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
        
        .empty-state { text-align: center; color: var(--text-light); padding: 40px 20px; line-height: 1.6; }
        .empty-state i { font-size: 40px; margin-bottom: 15px; color: #bdc3c7; }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .app-container { height: 100vh; border-radius: 0; }
            .chat-header { padding: 12px 15px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="login-screen">
            <h1><i class="fas fa-comment-dots"></i> 语音代聊室</h1>
            <p class="subtitle" id="welcome-text">🔐 端到端加密 · 无需服务器保存记录</p>
            
            <div class="input-group">
                <input type="text" id="username" class="input-field" placeholder="输入你的昵称" maxlength="10">
                <input type="text" id="password" class="input-field" placeholder="房间口令 (留空则自动生成)" maxlength="12">
            </div>
            
            <div class="btn-group" id="action-buttons">
                <button class="btn btn-create" id="btn-create" onclick="createRoom()">
                    <i class="fas fa-door-open"></i> 创建新房间
                </button>
                <button class="btn btn-join" id="btn-join" onclick="joinRoom()">
                    <i class="fas fa-user-friends"></i> 加入房间
                </button>
            </div>
            
            <div id="login-status" class="status"></div>
            
            <p style="color: var(--text-light); font-size: 12px; margin-top: 10px;">
                <i class="fas fa-info-circle"></i> 创建房间后可一键复制链接邀请好友
            </p>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <div class="header-title">
                    <div class="title">🔒 私密聊天室</div>
                    <div class="room-id" onclick="shareRoom()" style="cursor: pointer;" title="点击复制口令">
                        口令: <span id="header-pwd"></span> <i class="fas fa-copy"></i>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="share-btn" class="icon-btn" onclick="shareRoom()" title="分享邀请链接">
                        <i class="fas fa-share-alt"></i>
                    </button>
                    <button id="voice-toggle" class="icon-btn active" onclick="toggleVoice()" title="关闭语音播报">
                        <i class="fas fa-volume-up"></i>
                    </button>
                    <button class="icon-btn exit-btn" onclick="exitChat()" title="退出房间">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
            
            <div class="chat-box" id="chat-box"></div>

            <div class="input-area">
                <input type="text" id="msg-input" placeholder="输入消息 (回车发送)..." autocomplete="off">
                <button id="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 全局配置与状态
        const ROOM_PREFIX = 'p2p-tts-chat-v3-';
        let peer = null;
        let conn = null;
        let myName = '';
        let roomPassword = '';
        let isVoiceEnabled = true;
        const synth = window.speechSynthesis;

        // UI 缓存
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const loginStatus = document.getElementById('login-status');
        const voiceToggleBtn = document.getElementById('voice-toggle');
        const pwdInput = document.getElementById('password');

        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 检查是否通过分享链接进入
            const urlParams = new URLSearchParams(window.location.search);
            const inviteRoom = urlParams.get('room');
            
            if (inviteRoom) {
                pwdInput.value = inviteRoom;
                pwdInput.classList.add('readonly');
                pwdInput.readOnly = true;
                document.getElementById('welcome-text').innerHTML = '👋 你收到了一份私密聊天邀请';
                document.getElementById('btn-create').classList.add('hidden'); // 隐藏创建按钮
            }

            // 绑定回车发送
            msgInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });

        // 生成随机口令
        function generateRandomCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // ==========================================
        // 核心黑科技：强制解锁手机端音频引擎
        // 必须在用户发生真实的点击行为时触发
        // ==========================================
        function unlockAudioEngine() {
            if ('speechSynthesis' in window) {
                const unlockMsg = new SpeechSynthesisUtterance('');
                unlockMsg.volume = 0; // 静音播报，仅用于获取权限
                synth.speak(unlockMsg);
            }
        }

        // 创建房间 (Host)
        function createRoom() {
            myName = document.getElementById('username').value.trim();
            if (!myName) return showStatus('❌ 请先输入您的昵称', 'error');

            unlockAudioEngine(); // 解锁语音

            let rawPwd = pwdInput.value.trim();
            if (!rawPwd) {
                rawPwd = generateRandomCode();
                pwdInput.value = rawPwd;
            }
            roomPassword = rawPwd;
            const myPeerId = ROOM_PREFIX + roomPassword;

            showStatus('🔬 正在建立安全通道...', 'info');
            initPeer(myPeerId, true);
        }

        // 加入房间 (Guest)
        function joinRoom() {
            myName = document.getElementById('username').value.trim();
            roomPassword = pwdInput.value.trim();
            
            if (!myName) return showStatus('❌ 请先输入您的昵称', 'error');
            if (!roomPassword) return showStatus('❌ 请输入要加入的房间口令', 'error');

            unlockAudioEngine(); // 解锁语音

            showStatus('🔍 正在寻找房间...', 'info');
            initPeer(null, false);
        }

        // 初始化 Peer
        function initPeer(peerId, isHost) {
            cleanupPeer();

            // 使用公共 STUN 服务器提升连通率
            peer = peerId ? new Peer(peerId, {
                config: {
                    iceServers: [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            }) : new Peer({
                config: {
                    iceServers: [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                if (isHost) {
                    showStatus('✅ 房间创建成功！', 'success');
                    enterChatUI(true);
                } else {
                    const targetId = ROOM_PREFIX + roomPassword;
                    conn = peer.connect(targetId, { reliable: true });
                    setupConnectionEvents(conn, 'guest');
                }
            });

            if (isHost) {
                peer.on('connection', (connection) => {
                    if (conn) {
                        connection.on('open', () => {
                            connection.send({ type: 'system', text: '房间已满，拒绝加入。' });
                            setTimeout(() => connection.close(), 500);
                        });
                        return;
                    }
                    conn = connection;
                    setupConnectionEvents(conn, 'host');
                });
            }

            peer.on('error', (err) => {
                console.error('Peer 错误:', err);
                if (err.type === 'unavailable-id') {
                    showStatus('❌ 该口令已被使用，请换一个', 'error');
                } else if (err.type === 'peer-unavailable') {
                    showStatus('❌ 找不到该房间，请确认口令或对方是否在线', 'error');
                } else {
                    showStatus(`❌ 连接失败: 请检查网络`, 'error');
                }
            });
        }

        // 设置数据通道事件
        function setupConnectionEvents(connection, role) {
            connection.on('open', () => {
                if (role === 'guest') enterChatUI(false);
                
                // 清理等待界面的空状态
                const emptyState = chatBox.querySelector('.empty-state');
                if (emptyState) emptyState.remove();

                const joinMsg = role === 'host' ? `对方已加入房间` : `${myName} 加入了聊天`;
                appendMessage('系统', joinMsg, 'system');
                
                if (role === 'guest') {
                    conn.send({ type: 'system', text: `${myName} 成功连接` });
                }
            });

            connection.on('data', (data) => {
                if (data.type === 'chat') {
                    appendMessage(data.name, data.text, 'friend');
                    if (isVoiceEnabled) speakText(data.text);
                } else if (data.type === 'system') {
                    appendMessage('系统', data.text, 'system');
                }
            });

            connection.on('close', () => {
                appendMessage('系统', '⚠️ 对方已断开连接，聊天结束', 'system');
                conn = null;
            });
        }

        // 切换到聊天界面
        function enterChatUI(isHost) {
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            document.getElementById('header-pwd').textContent = roomPassword;
            chatBox.innerHTML = '';
            
            if(isHost) {
                chatBox.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-clock"></i>
                        <p>房间创建成功！等待对方加入...<br><br>
                        <button onclick="shareRoom()" style="padding:10px 20px; border-radius:20px; border:none; background:var(--primary); color:white; cursor:pointer;">
                            <i class="fas fa-share-alt"></i> 点击一键复制邀请链接
                        </button></p>
                    </div>`;
            } else {
                chatBox.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>正在连接房主...</p>
                    </div>`;
            }
            setTimeout(() => msgInput.focus(), 300);
        }

        // 发送消息
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !conn || !conn.open) {
                if(!conn) alert('尚未连接成功，请等待或分享链接邀请好友。');
                return;
            }

            appendMessage(myName, text, 'me');
            conn.send({ type: 'chat', name: myName, text: text });
            
            msgInput.value = '';
            msgInput.focus();
        }

        // UI 渲染消息
        function appendMessage(sender, text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message msg-${type}`;
            
            if (type === 'system') {
                msgDiv.textContent = text;
            } else {
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                msgDiv.innerHTML = `<div class="msg-name"><span>${sender}</span> <span>${timeStr}</span></div><div>${text}</div>`;
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 分享逻辑：复制带有参数的 URL 到剪贴板
        function shareRoom() {
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}?room=${roomPassword}`;
            
            // 使用现代浏览器的 Clipboard API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert(`✅ 邀请链接已复制！\n直接发给好友，对方打开即可加入。\n口令：${roomPassword}`);
                }).catch(err => {
                    prompt("请手动复制以下链接：", shareUrl);
                });
            } else {
                prompt("请手动复制以下链接发送给好友：", shareUrl);
            }
        }

        // 语音播报开关
        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            if (isVoiceEnabled) {
                voiceToggleBtn.classList.add('active');
                voiceToggleBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                speakText("语音播报已开启");
            } else {
                voiceToggleBtn.classList.remove('active');
                voiceToggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                synth.cancel();
            }
        }

        // 执行播报
        function speakText(text) {
            if (!text || text.includes('成功连接')) return;
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.1;
            synth.speak(utterance);
        }

        // 退出房间
        function exitChat() {
            if (confirm('确定要退出当前房间吗？')) {
                cleanupPeer();
                // 清理 URL 参数
                window.history.replaceState({}, document.title, window.location.pathname);
                chatScreen.style.display = 'none';
                loginScreen.style.display = 'flex';
                document.getElementById('btn-create').classList.remove('hidden');
                pwdInput.classList.remove('readonly');
                pwdInput.readOnly = false;
                pwdInput.value = '';
                document.getElementById('welcome-text').innerHTML = '🔐 端到端加密 · 无需服务器保存记录';
                showStatus('已退出房间', 'info', 2000);
            }
        }

        // 销毁连接
        function cleanupPeer() {
            if (conn) { try { conn.close(); } catch (e) {} conn = null; }
            if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
        }

        // 状态提示条
        function showStatus(msg, type, duration = 3000) {
            loginStatus.textContent = msg;
            loginStatus.className = `status ${type}`;
            setTimeout(() => { if (loginStatus.textContent === msg) loginStatus.textContent = ''; }, duration);
        }
    </script>
</body>
</html>
